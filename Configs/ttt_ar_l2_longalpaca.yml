data:
  name: "longalpaca"
  path: "Yukang/LongAlpaca-12k"
  num_train_docs: 12000
  num_val_docs: 100
  batch_size: 8
  micro_batch_size: 1
  val_set_size: 200
model:
  name: 'ttt_ar'
  pretrained_model_name_or_path: ${oc.env:TTT_INIT,${oc.env:TTT_CKPT_DIR,checkpoints}/ttt_at_l2_longalpaca/best_ckpt}
  max_length: 8192
  attn_varient: "ttt"
  lact_chunk_size: 512
  window_size: 512
  ttt_inner_loss: 'l2'
  ttt_base_lr: 0.018
  ttt_retention_init_bias: 4.0
  ttt_gate: 'sigmoid'
  ttt_scale_init_bias: -3.0
  fw_init_gain: 1.0
  ttt_use_momentum: True
  ttt_use_muon: True
  add_eos_token: False
  device_map: 'auto'
train:
  optim: 'adamw_torch'
  lr: 0.0001
  epochs: 1
  max_steps: 400
  max_grad_norm: 1.0
  gradient_checkpointing: True
  eval_steps: 100
  save_steps: 100000
  output_dir: ${oc.env:TTT_CKPT_DIR,checkpoints}
  train_qk: True
  train_qk_lora: True
  train_v: True
  train_v_lora: True
