data:
  name: "longalpaca"
  path: "Yukang/LongAlpaca-12k"
  num_train_docs: 12000
  num_val_docs: 100
  batch_size: 8
  micro_batch_size: 1
  val_set_size: 200
  short_mix_path: "yahma/alpaca-cleaned"
  short_mix_docs: 4000
model:
  name: 'ttt_at'
  pretrained_model_name_or_path: ${oc.env:TTT_INIT,mistralai/Mistral-7B-v0.1}
  max_length: 8192
  attn_varient: "ttt"
  lact_chunk_size: 512
  window_size: 512
  ttt_inner_loss: 'l2'
  ttt_base_lr: 0.018
  ttt_retention_init_bias: 4.0
  ttt_layer_indices: null
  ttt_share_groups: [[0, 1], [28, 29, 30, 31]]
  ttt_reader_alignment: linear
  ttt_gate: 'sigmoid'
  ttt_scale_init_bias: -3.0
  fw_init_gain: 1.0
  ttt_use_momentum: True
  ttt_use_muon: True
  add_eos_token: False
  device_map: 'auto'
train:
  optim: 'adamw_torch'
  lr_scheduler: linear
  lr: 0.0002
  epochs: 1
  max_steps: 500
  max_grad_norm: 1.0
  mse_factor: 1000
  lm_loss_weight: 1.0
  metric_for_best_model: 'eval/loss_ce'
  gradient_checkpointing: True
  eval_steps: 25
  save_steps: 100000
  output_dir: ${oc.env:TTT_CKPT_DIR,checkpoints}
